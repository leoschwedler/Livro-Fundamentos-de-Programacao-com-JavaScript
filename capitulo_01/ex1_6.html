<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport detecta a largura do dispositivo -->
    <!-- width=device-width faz a tela ser igual a largura do dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const inputValor1 = prompt("Informe o primeiro Numero");
      const inputValor2 = prompt("Informe o segundo Numero");
      alert(
        `A soma entre o numero ${inputValor1} + ${inputValor2} é ${Number(inputValor1) + Number(inputValor2)}`,
      );
    </script>
  </head>
  <body></body>
</html>
