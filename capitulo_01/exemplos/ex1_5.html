<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport detecta a largura do dispositivo -->
    <!-- width=device-width faz a tela ser igual a largura do dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const input = prompt("Digite um valor");
      alert(
        "O dobro do valor informado: " + input + " é: " + Number(input) * 2,
      );
    </script>
  </head>
  <body></body>
</html>
