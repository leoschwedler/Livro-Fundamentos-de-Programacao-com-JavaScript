<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport detecta a largura do dispositivo -->
    <!-- width=device-width faz a tela ser igual a largura do dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const valorJantar = prompt("Informe o valor do jantar:");
      const taxaGarcom = valorJantar * 0.1;
      alert(`
            Valor do Jantar: ${valorJantar}
            Taxa do Garcom: ${taxaGarcom}
            Total a pagar: ${Number(valorJantar) + Number(taxaGarcom)}
        `);
    </script>
  </head>
  <body></body>
</html>
