<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ex04" />
    <title>Ex04</title>
  </head>
  <body>
    <header>
      <h1>Restaurante JS</h1>
    </header>
    <main>
      <section>
        <form>
          <div>
            <label for="buffet">Buffet por Quilo R$:</label>
            <input type="text" id="buffet" name="buffet" required />
          </div>
          <div>
            <label for="consumo">Consumo do Cliente (gr):</label>
            <input type="number" id="consumo" name="consumo" required />
          </div>
          <button type="submit">Calcular Preco</button>
          <button id="limpar" type="reset">Limpar</button>
        </form>
        <span id="resultado"></span>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
