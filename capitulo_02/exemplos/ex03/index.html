<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ex04" />
    <title>Ex04</title>
  </head>
  <body>
    <header>
      <h1>Revenda de Veiculos JS</h1>
    </header>
    <main>
      <section>
        <form>
          <div>
            <label for="veiculo">Veiculo:</label>
            <input type="text" id="veiculo" name="veiculo" required />
          </div>
          <div>
            <label for="preco">Preco R$:</label>
            <input type="number" id="preco" name="preco" required />
          </div>
          <button type="submit">Ver Promocao</button>
          <button id="limpar" type="reset">Limpar</button>
        </form>
        <span id="resultado"></span>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
